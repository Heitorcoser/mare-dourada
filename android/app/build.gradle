plugins {
    id 'com.android.application'
}

// versão vem do workflow de release (tag v1.2.3 -> versionName 1.2.3, versionCode = número da execução)
def vName = System.getenv('VERSION_NAME') ?: '1.1.0'
def vCode = (System.getenv('VERSION_CODE') ?: '1') as int
def ksPath = System.getenv('KEYSTORE_PATH')

android {
    namespace 'io.github.heitorcoser.maredourada'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.heitorcoser.maredourada'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName
        buildConfigField 'String', 'SHELL_VERSION', "\"${vName}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // chave de debug FIXA (está no repositório, senha padrão "android"): todo APK sai com a mesma assinatura,
        // então o app novo instala por cima do antigo sem perder o progresso
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // opcional: chave privada guardada nos segredos do repositório (ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASS).
            // Sem ela, usa a chave de debug fixa acima.
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASS')
                keyAlias System.getenv('KEY_ALIAS') ?: 'mare'
                keyPassword System.getenv('KEYSTORE_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
